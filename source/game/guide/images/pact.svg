<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="610" viewBox="0 0 1020 610" role="img" aria-label="引路約定的定義、呼叫返回、參數與站數分工"><title>引路約定的定義、呼叫返回、參數與站數分工</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34688b"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5ddcd" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" rx="20" fill="#f4f5f2"/><g font-family="Microsoft JhengHei,PingFang TC,system-ui,sans-serif" fill="#23372e"><text x="30" y="42" font-size="24" font-weight="700">引路約定｜先定義，再喚醒，做完接續巡路</text><rect x="30" y="100" width="960" height="110" rx="12" fill="#e3eddf"/><text x="50" y="130" font-size="20" font-weight="700">抄寫定義</text><text x="50" y="162" font-size="18" >自行命名＋跨步 → 點燈 → 敲鈴</text><text x="50" y="192" font-size="16" >只有抄寫，石像不動</text><rect x="30" y="230" width="960" height="110" rx="12" fill="#e2eff7"/><text x="50" y="260" font-size="20" font-weight="700">喚醒一站</text><text x="50" y="292" font-size="18" >同一定義，本次跨2格或3格</text><text x="50" y="322" font-size="16" >做完返回外面的巡路安排，再升旗</text><rect x="30" y="360" width="960" height="110" rx="12" fill="#e3eddf"/><text x="50" y="390" font-size="20" font-weight="700">交接多站</text><text x="50" y="422" font-size="18" >跨2格 × 3站：到6格、鈴3次</text><text x="50" y="452" font-size="16" >跨3格 × 2站：到6格、鈴2次</text><text x="30" y="535" font-size="18" >燈庭抄寫臺（12,10）→ 要塞接班臺（14,8）→ 守路人（14,6）回報</text><text x="30" y="575" font-size="16" >改寫未交付的定義需重新驗證；交付後可調距離與站數重演，不重發獎勵。</text></g></svg>