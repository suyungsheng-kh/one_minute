<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="650" viewBox="0 0 1020 650" role="img" aria-label="三柱交班燈盤、三盞最短解與步數成長圖解"><title>三柱交班燈盤、三盞最短解與步數成長圖解</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34688b"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5ddcd" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" rx="20" fill="#f4f5f2"/><g font-family="Microsoft JhengHei,PingFang TC,system-ui,sans-serif" fill="#23372e"><text x="32" y="40" font-size="24" font-weight="700">交班燈柱｜先交小塔，再交主燈，最後接回</text><text x="32" y="76" font-size="16" >只取頂盤・一次一盤・大盤不壓小盤；走遠路仍可完成，不以最少趟數限制報酬。</text><rect x="104" y="245" width="132" height="13" rx="4" fill="#c8b48b" stroke="#315b47"/><rect x="166" y="120" width="8" height="125" fill="#d8c79e" stroke="#315b47"/><rect x="112" y="225" width="116" height="23" rx="3" fill="#7c9fb7" stroke="#315b47" stroke-width="2"/><text x="170" y="242" font-size="15" text-anchor="middle">3</text><rect x="125" y="196" width="90" height="23" rx="3" fill="#94b7a3" stroke="#315b47" stroke-width="2"/><text x="170" y="213" font-size="15" text-anchor="middle">2</text><rect x="138" y="167" width="64" height="23" rx="3" fill="#efd58b" stroke="#315b47" stroke-width="2"/><text x="170" y="184" font-size="15" text-anchor="middle">1</text><text x="170" y="285" font-size="19" text-anchor="middle" font-weight="700">起燈柱</text><rect x="434" y="245" width="132" height="13" rx="4" fill="#c8b48b" stroke="#315b47"/><rect x="496" y="120" width="8" height="125" fill="#d8c79e" stroke="#315b47"/><text x="500" y="285" font-size="19" text-anchor="middle" font-weight="700">接力柱</text><rect x="764" y="245" width="132" height="13" rx="4" fill="#c8b48b" stroke="#315b47"/><rect x="826" y="120" width="8" height="125" fill="#d8c79e" stroke="#315b47"/><text x="830" y="285" font-size="19" text-anchor="middle" font-weight="700">歸燈柱</text><text x="32" y="329" font-size="20" font-weight="700">三盞最短交接：依現行燈盤規則計算</text><text x="40" y="368" font-size="18" >1. 起燈柱 → 歸燈柱</text><text x="40" y="404" font-size="18" >2. 起燈柱 → 接力柱</text><text x="40" y="440" font-size="18" >3. 歸燈柱 → 接力柱</text><text x="40" y="476" font-size="18" >4. 起燈柱 → 歸燈柱</text><text x="520" y="368" font-size="18" >5. 接力柱 → 起燈柱</text><text x="520" y="404" font-size="18" >6. 接力柱 → 歸燈柱</text><text x="520" y="440" font-size="18" >7. 起燈柱 → 歸燈柱</text><text x="32" y="540" font-size="18" >小塔沿用相同交法；只剩一盞時直接交接，這一段就結束。</text><text x="32" y="579" font-size="17" >最少趟數：1 盞 1｜2 盞 3｜3 盞 7｜4 盞 15｜5 盞 31｜6 盞 63</text><text x="32" y="614" font-size="16" >可操作一至四盞；五、六盞只在交班簿說明。每多一盞＝兩趟小塔＋主燈一趟。</text></g></svg>