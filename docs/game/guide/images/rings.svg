<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img" aria-label="聖域三環石盤連動解法"><title>聖域三環石盤連動解法</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34688b"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5ddcd" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" rx="20" fill="#f4f5f2"/><g font-family="Microsoft JhengHei,PingFang TC,system-ui,sans-serif" fill="#23372e"><text x="32" y="38" font-size="25" font-weight="700">三環石盤｜外日・中月・內星</text><circle cx="230" cy="225" r="145" fill="#e3eddf" stroke="#718568" stroke-width="3"/><text x="230" y="107" font-size="18" text-anchor="middle" font-weight="700">外環 → 日</text><circle cx="230" cy="225" r="102" fill="#fbf1cb" stroke="#718568" stroke-width="3"/><text x="230" y="150" font-size="18" text-anchor="middle" font-weight="700">中環 → 月</text><circle cx="230" cy="225" r="59" fill="#e2eff7" stroke="#718568" stroke-width="3"/><text x="230" y="193" font-size="18" text-anchor="middle" font-weight="700">內環 → 星</text><text x="440" y="110" font-size="21" font-weight="700">連動規則</text><text x="440" y="151" font-size="17" >外環轉一次：外、中、內各前進一格</text><text x="440" y="191" font-size="17" >中環轉一次：中、內各前進一格</text><text x="440" y="231" font-size="17" >內環轉一次：只有內環前進一格</text><text x="440" y="271" font-size="17" >符號循環：日 → 月 → 星 → 日</text><rect x="434" y="310" width="525" height="102" rx="14" fill="#fff"/><text x="454" y="342" font-size="17" >從初始環位（月／日／日）開始：</text><text x="454" y="378" font-size="22" font-weight="700" fill="#315b47">外環 ×2 → 中環 ×2 → 內環 ×1</text><text x="32" y="450" font-size="16" >先找到三枚誓印，才可轉動對應環柄；對齊後還要調查中央石盤。</text><text x="32" y="480" font-size="13" fill="#626c65">這是石盤連動示意圖，非遊戲截圖。</text></g></svg>