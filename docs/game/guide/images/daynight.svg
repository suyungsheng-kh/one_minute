<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="日夜時間及營地規則圖"><title>日夜時間及營地規則圖</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34688b"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5ddcd" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" rx="20" fill="#f4f5f2"/><g font-family="Microsoft JhengHei,PingFang TC,system-ui,sans-serif" fill="#23372e"><text x="32" y="40" font-size="25" font-weight="700">日夜與營地｜看懂時間再出發</text><rect x="48" y="100" width="864" height="68" rx="18" fill="#233f3b"/><rect x="264" y="100" width="432" height="68" fill="#fbf1cb"/><text x="48" y="202" font-size="17" text-anchor="middle">00:00</text><text x="264" y="202" font-size="17" text-anchor="middle">06:00</text><text x="696" y="202" font-size="17" text-anchor="middle">18:00</text><text x="912" y="202" font-size="17" text-anchor="middle">24:00</text><text x="480" y="143" font-size="22" text-anchor="middle" font-weight="700">白天</text><text x="150" y="143" font-size="20" text-anchor="middle" fill="#fff">夜晚</text><text x="800" y="143" font-size="20" text-anchor="middle" fill="#fff">夜晚</text><rect x="48" y="244" width="864" height="58" rx="12" fill="#e3eddf"/><text x="70" y="280" font-size="17" font-weight="700">野外夜間</text><text x="286" y="280" font-size="16" >生命、攻擊 ×2；夜行怪巡遊</text><rect x="48" y="316" width="864" height="58" rx="12" fill="#e2eff7"/><text x="70" y="352" font-size="17" font-weight="700">洞窟／迷宮夜間</text><text x="286" y="352" font-size="16" >生命、攻擊 ×1.5</text><rect x="48" y="388" width="864" height="58" rx="12" fill="#e3eddf"/><text x="70" y="424" font-size="17" font-weight="700">營地與野營</text><text x="286" y="424" font-size="16" >營地每八遊戲小時恢復一次；工具組 120 G</text><text x="48" y="492" font-size="16" >一日為 12 分鐘有效遊玩時間；對話、選單與暫停不推進時鐘。</text></g></svg>