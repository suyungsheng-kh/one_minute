" stroke="#fff" stroke-width="2"/><text x="144" y="183" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="650" y="92" font-size="15" >1　屋簷門鎖：支架與鎖環都到位才開</text><circle cx="264" cy="178" r="13" fill="#315b47" stroke="#fff" stroke-width="2"/><text x="264" y="183" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="650" y="130" font-size="15" >2　留夜燈：火種或月光晶，兩種都有也亮</text><circle cx="144" cy="226" r="13" fill="#315b47" stroke="#fff" stroke-width="2"/><text x="144" y="231" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="650" y="168" font-size="15" >3　安全燈：有陰影的相反結果</text><circle cx="216" cy="226" r="13" fill="#315b47" stroke="#fff" stroke-width="2"/><text x="216" y="231" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="650" y="206" font-size="15" >4　修繕委託：借用試驗道具，不消耗背包</text><circle cx="216" cy="178" r="13" fill="#315b47" stroke="#fff" stroke-width="2"/><text x="216" y="183" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">5</text><text x="650" y="244" font-size="15" >5　藥師青葉：原商店＋完成後回報</text><circle cx="312" cy="250" r="13" fill="#315b47" stroke="#fff" stroke-width="2"/><text x="312" y="255" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">6</text><text x="650" y="282" font-size="15" >6　送藥人：回報後在屋簷下歇腳</text><text x="36" y="487" font-size="14" >上北下南；色塊為阻擋區。數字與下方文字對照。</text><text x="36" y="512" font-size="13" fill="#626c65">依現行地圖格位繪製的攻略示意圖，非遊戲截圖。</text></g></svg>