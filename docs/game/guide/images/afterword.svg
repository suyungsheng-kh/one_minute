<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" role="img" aria-label="八十四號搜尋失敗、新航記劇情與晚到藥箱插入圖解"><title>八十四號搜尋失敗、新航記劇情與晚到藥箱插入圖解</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34688b"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#d5ddcd" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" rx="20" fill="#f4f5f2"/><g font-family="Microsoft JhengHei,PingFang TC,system-ui,sans-serif" fill="#23372e"><text x="30" y="42" font-size="24" font-weight="700">舊冊之外的信｜查無此站，也是可以回報的結果</text><text x="30" y="92" font-size="18" >同一份16頁有序舊冊，目標84號；舊冊確實沒有這個站。</text><text x="30" y="144" font-size="21" >逐頁：核對16頁 → 全部查完 → 查無此站</text><text x="30" y="196" font-size="21" >折半：41 → 69 → 83 → 91 → 範圍變空 → 查無此站</text><text x="30" y="258" font-size="18" >回抄寫人 → 取得霧潮後的新航記 → 去東岸避風所聽安置點往事</text><text x="30" y="306" font-size="16" >比較查閱次數16與4，整理成本另計，不以閱讀秒數計分。</text><text x="30" y="385" font-size="23" font-weight="700">晚到的一箱｜不用重做原三批貨</text><text x="30" y="430" font-size="20" >原隊列：1 → 2 → 4 → 5 ＋ 手持3號箱</text><text x="30" y="475" font-size="20" >右挪5、右挪4、核對2、插入3 → 1 → 2 → 3 → 4 → 5</text><text x="30" y="525" font-size="16" >只需3次核對、2次挪箱；無倒數失敗，原任務進度與獎勵保留。</text></g></svg>