<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">誰比較快？｜一分鐘認識</title><desc id="desc">搜尋系列第3集，看最多比較次數，怎麼隨資料成長</desc><g font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f5f2" /><rect x="0" y="0" width="14" height="720" rx="0" fill="#34688b" /><path d="M64 141h1152M64 618h1152" stroke="#dfe3d8" stroke-width="2"/><svg x="64" y="52" width="53" height="53" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#315b47"/><path d="M15 10v22h18v6H9V10z" fill="#ffffff"/><path d="m23 12 14 9-14 9z" fill="#ffffff"/></svg><text x="134" y="87" font-size="39" fill="#23372e" font-weight="800">一分鐘認識</text><text x="134" y="117" font-size="18" fill="#626c65" >一分鐘，認識一個概念</text><rect x="976" y="60" width="240" height="56" rx="28" fill="#e2eff7" /><text x="1096" y="98" font-size="27" fill="#34688b" text-anchor="middle" font-weight="700">搜尋系列</text><rect x="792" y="182" width="408" height="407" rx="40" fill="#e2eff7" /><text x="64" y="211" font-size="25" fill="#34688b" font-weight="700" letter-spacing="2">搜尋 / 03</text><text x="64" y="363" font-size="88" fill="#23372e" font-weight="800" letter-spacing="-2">誰比較快？</text><text x="68" y="431" font-size="29" fill="#626c65" >看最多比較次數，怎麼隨資料成長</text><rect x="68" y="534" width="62" height="6" rx="3" fill="#c6a34c" /><path d="M625 555c39 14 48-40 107-38m-17-12 18 12-16 13" fill="none" stroke="#34688b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="m1184 157 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z" fill="#c6a34c"/><path d="M824 591v18m-9-9h18" fill="none" stroke="#34688b" stroke-width="3" stroke-linecap="round"/><text x="836" y="230" font-size="27" fill="#34688b" >100 筆已排序資料</text><text x="836" y="273" font-size="23" fill="#34688b" >最多比較次數</text><text x="836" y="335" font-size="24" fill="#23372e" >循序</text><r