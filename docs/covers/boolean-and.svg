<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">且：兩個條件，都要成立｜一分鐘認識</title><desc id="desc">布林邏輯系列第1集，有鑰匙，而且能量足夠，城門才開</desc><g font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f5f2" /><rect x="0" y="0" width="14" height="720" rx="0" fill="#315b47" /><path d="M64 141h1152M64 618h1152" stroke="#dfe3d8" stroke-width="2"/><svg x="64" y="52" width="53" height="53" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#315b47"/><path d="M15 10v22h18v6H9V10z" fill="#ffffff"/><path d="m23 12 14 9-14 9z" fill="#ffffff"/></svg><text x="134" y="87" font-size="39" fill="#23372e" font-weight="800">一分鐘認識</text><text x="134" y="117" font-size="18" fill="#626c65" >一分鐘，認識一個概念</text><rect x="976" y="60" width="240" height="56" rx="5" fill="#e9ede7" /><text x="1096" y="98" font-size="27" fill="#315b47" text-anchor="middle" font-weight="700">布林邏輯系列</text><rect x="792" y="182" width="408" height="407" rx="8" fill="#edf0eb" /><text x="64" y="211" font-size="25" fill="#315b47" font-weight="700" letter-spacing="2">布林邏輯 / 01</text><text x="64" y="303" font-size="88" fill="#23372e" font-weight="800" letter-spacing="-2">且</text><text x="64" y="407" font-size="88" fill="#23372e" font-weight="800" letter-spacing="-2">全部成立才成立</text><text x="68" y="472" font-size="29" fill="#626c65" >有鑰匙，而且能量足夠，城門才開</text><rect x="68" y="534" width="62" height="6" rx="0" fill="#c6a34c" /><text x="996" y="235" font-size="27" fill="#315b47" text-anchor="middle" font-weight="700">全部成立才成立</text><rect x="846" y="270" width="300" height="78" rx="16" fill="#ffffff" /><text x="868" y="319" font-size="24" fill="#315b47" font-weight="700">01</text><text x="922" y="319" font-size="28" fill="#23372e" >真 且 假</text><path d="M996 352v27m-9-9 9 9 9-9" fill="none" stroke="#315b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="846" y="390" width="300" height="78" rx="16" fill="#ffffff" /><text x="868" y="439" font-size="24" fill="#315b47" font-weight="700">02</text><text x="922" y="439" font-size="28" fill="#23372e" >結果：假</text><text x="996" y="550" font-size="25" fill="#315b47" text-anchor="middle">先判斷，再選動作</text><text x="64" y="663" font-size="25" fill="#626c65" >把好奇，變成理解。</text><text x="1216" y="663" font-size="25" fill="#315b47" text-anchor="end" font-weight="700">01 / 03</text></g></svg>
