<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">清單｜一分鐘認識</title><desc id="desc">Scratch系列第2集，把多個項目，有順序地記住</desc><g font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f8f6ef" /><rect x="0" y="0" width="14" height="720" rx="0" fill="#3d6852" /><path d="M64 141h1152M64 618h1152" stroke="#dfe3d8" stroke-width="2"/><svg x="64" y="52" width="53" height="53" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#ef7253"/><path d="M15 10v22h18v6H9V10z" fill="#fff9ee"/><path d="m23 12 14 9-14 9z" fill="#fff9ee"/></svg><text x="134" y="87" font-size="39" fill="#24382f" font-weight="800">一分鐘認識</text><text x="134" y="117" font-size="18" fill="#68766d" >一分鐘，認識一個概念</text><rect x="976" y="60" width="240" height="56" rx="28" fill="#e2e9d8" /><text x="1096" y="98" font-size="27" fill="#3d6852" text-anchor="middle" font-weight="700">Scratch系列</text><rect x="792" y="182" width="408" height="407" rx="42" fill="#e2e9d8" /><text x="64" y="211" font-size="25" fill="#3d6852" font-weight="700" letter-spacing="2">Scratch / 02</text><text x="64" y="363" font-size="88" fill="#24382f" font-weight="800" letter-spacing="-2">清單</text><text x="68" y="431" font-size="29" fill="#68766d" >把多個項目，有順序地記住</text><rect x="68" y="534" width="62" height="6" rx="3" fill="#3d6852" /><rect x="846" y="238" width="300" height="72" rx="14" fill="#fffdf7" /><text x="870" y="285" font-size="25" fill="#3d6852" >01</text><text x="943" y="285" font-size="30" fill="#24382f" >藥水</text><rect x="846" y="327" width="300" height="72" rx="14" fill="#fffdf7" /><text x="870" y="374" font-size="25" fill="#3d6852" >02</text><text x="943" y="374" font-size="30" fill="#24382f" >火把</text><rect x="846" y="416" width="300" height="72" rx="14" fill="#fffdf7" /><text x="870" y="463" font-size="25" fill="#3d6852" >03</text><text x="943" y="463" font-size="30" fill="#24382f" >繩子</text><text x="996" y="550" font-size="24" fill="#3d6852" text-anchor="middle">有順序的多個項目</text><text x="64" y="663" font-size="25" fill="#68766d" >把好奇，變成理解。</text><text x="1216" y="663" font-size="25" fill="#3d6852" text-anchor="end" font-weight="700">02 / 03</text></g></svg>
