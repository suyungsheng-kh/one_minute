<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">步數爆炸｜一分鐘認識</title><desc id="desc">河內塔系列第3集，每多一個圓盤，翻倍再加一</desc><g font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif"><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f8f6ef" /><rect x="0" y="0" width="14" height="720" rx="0" fill="#995012" /><path d="M64 141h1152M64 618h1152" stroke="#dfe3d8" stroke-width="2"/><svg x="64" y="52" width="53" height="53" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#ef7253"/><path d="M15 10v22h18v6H9V10z" fill="#fff9ee"/><path d="m23 12 14 9-14 9z" fill="#fff9ee"/></svg><text x="134" y="87" font-size="39" fill="#24382f" font-weight="800">一分鐘認識</text><text x="134" y="117" font-size="18" fill="#68766d" >一分鐘，認識一個概念</text><rect x="976" y="60" width="240" height="56" rx="28" fill="#fff0d9" /><text x="1096" y="98" font-size="27" fill="#995012" text-anchor="middle" font-weight="700">河內塔系列</text><rect x="792" y="182" width="408" height="407" rx="42" fill="#fff0d9" /><text x="64" y="211" font-size="25" fill="#995012" font-weight="700" letter-spacing="2">河內塔 / 03</text><text x="64" y="363" font-size="88" fill="#24382f" font-weight="800" letter-spacing="-2">步數爆炸</text><text x="68" y="431" font-size="29" fill="#68766d" >每多一個圓盤，翻倍再加一</text><rect x="68" y="534" width="62" height="6" rx="3" fill="#995012" /><path d="M838 484h315M885 274v210m110-210v210m110-210v210" fill="none" stroke="#995012" stroke-width="5" stroke-linecap="round"/><rect x="1050" y="442" width="110" height="32" rx="10" fill="#d9b487" /><rect x="1061" y="397" width="88" height="32" rx="10" fill="#d9b487" /><rect x="1072" y="352" width="66" height="32" rx="10" fill="#995012" /><text x="996" y="230" font-size="27" fill="#995012" text-anchor="middle">最少搬動步數</text><text x="996" y="553" font-size="27" fill="#995012" text-anchor="middle">1 → 3 → 7 → 15</text><text x="64" y="663" font-size="25" fill="#68766d" >把好奇，變成理解。</text><text x="1216" y="663" font-size="25" fill="#995012" text-anchor="end" font-weight="700">03 / 03</text></g></svg>
